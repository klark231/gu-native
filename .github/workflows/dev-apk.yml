name: Dev APK (manual)

# A TEST build, run by hand from the Actions tab (Run workflow). It is built with MHGU_DEV=1, so the app reads
#   Android/data/com.mhgu.recomp/files/env.txt      (NAME=value lines, e.g. MHGU_LOG_NET=2)
#   Android/data/com.mhgu.recomp/files/control.txt
# at start-up. The public release.yml build reads neither file.
#
# It never publishes a release: the APK is an artifact of the run (Actions > the run > Artifacts), kept 14 days.
# It carries no game code: libmhgugame.so is excluded exactly as in the public APK, and the job fails if it is inside.
#
# Signing: with the four secrets of release.yml set, it uses your key (so it can update over your release build).
# Without them it makes a throwaway key for this run: the APK installs, but each run has a different key, so
# uninstall the previous one first (your saves and settings are in Android/data: export the save first).

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Label added to the APK name (optional, letters/digits/-)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dev-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: 27.0.12077973
      MHGU_DEV: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK parts (NDK r27, CMake 3.22.1)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Cache native dependencies (SDL3, shaderc, FFmpeg)
        uses: actions/cache@v4
        with:
          path: |
            deps/src
            deps/out
            deps/tmp/dl
          key: deps-${{ runner.os }}-${{ hashFiles('deps/*.sh') }}

      - name: Native dependencies
        run: |
          bash deps/fetch_sources.sh
          JOBS=$(nproc) bash deps/build_deps.sh arm64-v8a
          JOBS=$(nproc) bash deps/build_ffmpeg.sh arm64-v8a

      # MHGU_DEV=1 (job env) is what native/build_native.sh passes to CMake as -DMHGU_DEV
      - name: Runtime (libmain.so, test build)
        run: JOBS=$(nproc) bash native/build_native.sh arm64-v8a

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ] && [ -n "$AL" ] && [ -n "$KP" ]; then
            printf %s "$KS" | base64 -d > android/mhgu.keystore
            { echo "storePassword=$PW"; echo "keyAlias=$AL"; echo "keyPassword=$KP"; } > android/keystore.properties
            echo "kind=your-key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: using a throwaway key for this run (uninstall the previous dev APK before installing)"
            PW=$(openssl rand -hex 12)
            keytool -genkeypair -keystore android/mhgu.keystore -storepass "$PW" -keypass "$PW" \
              -alias devkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MHGU dev" > /dev/null
            { echo "storePassword=$PW"; echo "keyAlias=devkey"; echo "keyPassword=$PW"; } > android/keystore.properties
            echo "kind=throwaway" >> "$GITHUB_OUTPUT"
          fi

      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Name and verify the APK
        id: apk
        env:
          NOTE: ${{ github.event.inputs.note }}
        run: |
          VERSION=$(cat VERSION)
          LABEL=$(printf %s "$NOTE" | tr -cd 'A-Za-z0-9-')
          APK="MHGU-dev-$VERSION-run${GITHUB_RUN_NUMBER}${LABEL:+-$LABEL}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          # no game code in the APK, ever
          if unzip -l "$APK" | grep -q libmhgugame.so; then echo "::error::libmhgugame.so is inside the APK"; exit 1; fi
          # this must be the test build: the strings for env.txt are compiled in only with MHGU_DEV
          unzip -p "$APK" 'lib/arm64-v8a/libmain.so' | grep -q 'env.txt' \
            || { echo "::error::this APK does not read env.txt: MHGU_DEV was not applied"; exit 1; }
          sha256sum "$APK" | tee "$APK.sha256"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload the APK (artifact, 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          retention-days: 14
          if-no-files-found: error
