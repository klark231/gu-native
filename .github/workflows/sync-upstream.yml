name: Sync upstream

# Keeps this fork up to date with the original repository: every 6 hours (or from the Actions tab) it merges the
# upstream branch into this one. Your own changes stay, because they are commits on top of it. If upstream changed,
# the APK is built again (release.yml). If your changes and upstream's touch the same lines, nothing is merged and an
# issue is opened telling you so, because that needs a person to decide.
#
# Set once: Settings > Secrets and variables > Actions > Variables
#   UPSTREAM_REPO    the original repository, as owner/name
#   UPSTREAM_BRANCH  (optional) its branch, main by default

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
        run: |
          [ -n "$UPSTREAM" ] || { echo "::error::Set the repository variable UPSTREAM_REPO (owner/name of the original repository)"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch upstream "$BRANCH"
          if git merge-base --is-ancestor "upstream/$BRANCH" HEAD; then
            echo "Already up to date with $UPSTREAM@$BRANCH"
            exit 0
          fi
          if git merge --no-edit -m "Merge upstream $UPSTREAM@$BRANCH" "upstream/$BRANCH"; then
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | tee conflicts.txt
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tell me about a conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
        run: |
          gh label create upstream-conflict --color B60205 --description "Upstream could not be merged" 2>/dev/null || true
          if [ -z "$(gh issue list --label upstream-conflict --state open --json number --jq '.[].number')" ]; then
            {
              echo "Upstream ($UPSTREAM) has changes that touch the same lines as this fork's own changes, so they were not merged."
              echo
              echo "Files in conflict:"
              sed 's/^/- /' conflicts.txt
              echo
              echo "Fix it once on a computer or in Termux:"
              echo '```'
              echo "git remote add upstream https://github.com/$UPSTREAM.git   # once"
              echo "git fetch upstream && git merge upstream/${BRANCH}"
              echo "# fix the files, then: git add -A && git commit && git push"
              echo '```'
            } > body.md
            gh issue create --title "Upstream merge needs help" --label upstream-conflict --body-file body.md
          fi

      - name: Build the APK again
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ github.ref_name }}"
